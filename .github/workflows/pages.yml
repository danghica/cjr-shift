name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/package_docs.py'
      - 'work/docs/**'
      - 'work/CLI/doc/**'
      - 'work/CLI/example-working-time.json'
      - 'work/specs/verification.json'
      - 'work/code/test/test-results.json'
      - 'work/code/test/benchmark-results.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Package existing HTML and check links
        run: python3 scripts/package_docs.py --output build/pages-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages-site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

